spring.application.name=formforge
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=true

# ── HTTPS / SSL ────────────────────────────────────────────────────────────
# Set SSL_KEY_STORE_PASSWORD in production. Dev default matches the generated keystore.
# Railway terminates TLS at the edge — set SSL_ENABLED=false there.
server.port=${PORT:8443}
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=classpath:keystore/formforge.p12
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:formforge}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=formforge

# ── JWT ────────────────────────────────────────────────────────────────────
# JWT_SECRET must be at least 32 characters. No insecure default — must be set.
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=15
jwt.refresh-expiration-days=7

# ── DataSource (PostgreSQL) ────────────────────────────────────────────────
# DB_URL / DB_USERNAME / DB_PASSWORD must be set in production.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/formforge}
spring.datasource.username=${DB_USERNAME:formforge}
spring.datasource.password=${DB_PASSWORD:formforge}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── Flyway ─────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── MongoDB — disabled (chat messages now stored in PostgreSQL) ──────────
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

# ── Caching (Caffeine) ────────────────────────────────────────────────────
spring.cache.type=caffeine

# ── Scheduling (MV refresh every 10 min) ─────────────────────────────────
spring.task.scheduling.pool.size=2

# ── Ollama (local LLM for threat-detection AI explanations) ──────────────
# If OLLAMA_URL is not set the feature degrades silently — threat detection still works.
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2:1b}

# ── CORS ──────────────────────────────────────────────────────────────────
# Comma-separated list of allowed origins (supports * patterns).
# In production set this to your Vercel URL, e.g. https://formforge.vercel.app
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://localhost:*,http://localhost:*}

# ── Error responses ────────────────────────────────────────────────────────
server.error.include-message=always

# ── DataSeeder ─────────────────────────────────────────────────────────────
# Set SEED_DATA_ENABLED=true locally to populate fake users for load testing.
# Never enable in production.
seed.data.enabled=${SEED_DATA_ENABLED:false}
