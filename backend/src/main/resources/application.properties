spring.application.name=formforge
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=true

# ── HTTPS / SSL ────────────────────────────────────────────────────────────
# Set SSL_KEY_STORE_PASSWORD in production. Dev default matches the generated keystore.
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore/formforge.p12
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:formforge}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=formforge

# ── JWT ────────────────────────────────────────────────────────────────────
# JWT_SECRET must be at least 32 characters. No insecure default — must be set.
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=15
jwt.refresh-expiration-days=7

# ── DataSource (PostgreSQL) ────────────────────────────────────────────────
# DB_URL / DB_USERNAME / DB_PASSWORD must be set in production.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/formforge}
spring.datasource.username=${DB_USERNAME:formforge}
spring.datasource.password=${DB_PASSWORD:formforge}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── Flyway ─────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── MongoDB (chat messages) ────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/formforge_chat}

# ── Caching (Caffeine) ────────────────────────────────────────────────────
spring.cache.type=caffeine

# ── Scheduling (MV refresh every 10 min) ─────────────────────────────────
spring.task.scheduling.pool.size=2

# ── Error responses ────────────────────────────────────────────────────────
server.error.include-message=always
