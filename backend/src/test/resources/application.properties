# ── Test DataSource (H2 in-memory, PostgreSQL-compatible mode) ─────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate (recreate schema from entities each test run) ──────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ── Flyway disabled for tests (Hibernate handles schema via DDL) ───────────
spring.flyway.enabled=false

# ── SSL disabled for tests ─────────────────────────────────────────────────
server.ssl.enabled=false
server.port=8080

# ── JWT ────────────────────────────────────────────────────────────────────
jwt.secret=TestSecret-Min32Chars-ForHmacSha256Key!
jwt.expiration-minutes=30
